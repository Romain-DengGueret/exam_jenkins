image:
  repository: rom1dgg/movie-service
  pullPolicy: Always
  tag: "latest"

service:
  type: NodePort
  port: 80
  nodePort: 30033
  targetPort: 8000

env:
  - name: DATABASE_URI
    value: "postgresql://movie_db_username:movie_db_password@movie-db-postgresql.prod.svc.cluster.local:5432/movie_db_prod"
