image:
  repository: rom1dgg/movie-service
  pullPolicy: Always
  tag: "latest"

service:
  type: NodePort
  port: 80
  nodePort: 30023
  targetPort: 8000

env:
  - name: DATABASE_URI
    value: "postgresql://movie_db_username:movie_db_password@movie-db-postgresql.staging.svc.cluster.local:5432/movie_db_staging"
