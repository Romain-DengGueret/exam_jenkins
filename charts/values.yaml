replicaCount: 1

image:
  repository: rom1dgg/cast-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: "regcred"

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: NodePort
  port: 80
  targetPort: 8000

ingress:
  enabled: false

autoscaling:
  enabled: false

env: []
